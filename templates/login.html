<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Ikai Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F0; --panel:#FFFFFF; --ink:#2B2620; --muted:#8A8272;
    --primary:#1F3D2B; --primary-light:#2F5A3E; --accent:#C89B3C; --accent-dark:#A87F2A;
    --danger:#B5533C; --danger-bg:#F7E7E1; --border:#E4DCC8; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--primary);
    background-image:radial-gradient(circle at 15% 20%, rgba(255,255,255,0.05) 0%, transparent 45%),
                      radial-gradient(circle at 85% 80%, rgba(200,155,60,0.12) 0%, transparent 45%);
    font-family:'Inter',sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .wrap{width:100%;max-width:380px;}
  .brand{text-align:center;margin-bottom:26px;}
  .brand .mark{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:#fff;}
  .brand .tag{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:4px;}
  .card{background:var(--panel);border-radius:var(--radius);padding:32px 30px;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .card h1{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;font-weight:600;}
  .card p.sub{margin:0 0 22px;color:var(--muted);font-size:13px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:7px;font-size:14px;font-family:'Inter',sans-serif;}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .btn{width:100%;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
  .btn:hover{background:var(--primary-light);}
  .flash{padding:11px 14px;border-radius:7px;margin-bottom:16px;font-size:13px;font-weight:500;background:var(--danger-bg);color:var(--danger);border:1px solid #edc7b9;}
  .foot{text-align:center;margin-top:18px;font-size:12px;color:rgba(255,255,255,0.55);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark">Ikai Production</div>
      <div class="tag">Batch &amp; Stock Management</div>
    </div>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Use your admin or warehouse login to continue.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" required autofocus>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <button class="btn" type="submit">Sign in</button>
      </form>
    </div>
    <div class="foot">Ikai Organic — internal use only</div>
  </div>
</body>
</html>
